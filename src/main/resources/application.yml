spring:
  application:
    name: payledger

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payledger}
    username: ${DB_USERNAME:payledger}
    password: ${DB_PASSWORD:payledger_secret}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:payledger}
    password: ${RABBITMQ_PASSWORD:payledger_secret}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          multiplier: 2.0

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    # Em produção, injete uma chave forte de pelo menos 256 bits via variável de ambiente JWT_SECRET
    secret: ${JWT_SECRET:cGF5bGVkZ2VyLWRldi1zZWNyZXQta2V5LXdpdGgtYXQtbGVhc3QtMzItYnl0ZXM=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
