services:
  postgres:
    image: postgres:18-alpine
    container_name: payledger-postgres
    environment:
      POSTGRES_DB: payledger
      POSTGRES_USER: payledger
      POSTGRES_PASSWORD: payledger_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payledger -d payledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: payledger-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: payledger
      RABBITMQ_DEFAULT_PASS: payledger_secret
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
